# 诊断阈值离线调优 - 快速网格配置
# 只包含关键参数的合理范围，以加快搜索速度

# 图像可靠性阈值 - 聚焦最优范围
image_top1_threshold: [0.65, 0.70, 0.75]

# 文本可靠性阈值 - 聚焦最优范围
text_top1_threshold: [0.40, 0.45, 0.50]

# 诊断置信度阈值 - 关键参数，精细搜索
diagnosis_conf_threshold: [0.50, 0.55, 0.60, 0.65]

# 低 margin 阈值
low_margin_threshold: [0.03, 0.05, 0.08]

# 总组合数：3×3×4×3 = 108 个组合
# 相比完整网格 11,664 个组合，速度提升约 108 倍
