<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>病害图像诊断</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
    }
    header nav a {
      color: #d1d5db;
      margin-left: 12px;
      text-decoration: none;
      font-size: 14px;
    }
    main {
      padding: 20px 24px 36px;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .form-row label {
      font-size: 13px;
      color: #374151;
    }
    .input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-primary {
      border: none;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-secondary {
      border: none;
      background: #e5e7eb;
      color: #111827;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary:disabled,
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: #6b7280;
    }
    .preview {
      max-width: 100%;
      max-height: 260px;
      display: none;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .result-section {
      display: grid;
      gap: 10px;
      font-size: 14px;
    }
    .result-section ul {
      margin: 6px 0 0 16px;
    }
    .muted {
      color: #6b7280;
    }
    .warning {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 10px 12px;
      border-radius: 8px;
      color: #7a5d00;
      display: none;
    }
    .trace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .trace-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .trace-item {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #f9fafb;
      font-size: 13px;
    }
    .trace-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .trace-meta {
      color: #6b7280;
      font-size: 12px;
    }
    .trace-error {
      color: #b00020;
      font-size: 13px;
    }
    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .stepper { display: grid; gap: 8px; margin-bottom: 12px; }
    .step-item { display:flex; align-items:center; justify-content:space-between; border:1px solid #e5e7eb; border-radius:8px; padding:8px 10px; font-size:13px; background:#f9fafb; }
    .step-item .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#e5e7eb; color:#374151; }
    .step-item.running { border-color:#3b82f6; background:#eff6ff; }
    .step-item.running .badge { background:#3b82f6; color:#fff; }
    .step-item.done { border-color:#10b981; background:#ecfdf5; }
    .step-item.done .badge { background:#10b981; color:#fff; }
    .step-item.error { border-color:#ef4444; background:#fef2f2; }
    .step-item.error .badge { background:#ef4444; color:#fff; }
    .live-log { border:1px solid #e5e7eb; border-radius:10px; background:#0f172a; color:#e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; padding:8px; height:180px; overflow:auto; }
    .live-log-line { margin: 0 0 4px; white-space: pre-wrap; }

  </style>
</head>
<body>
  <header>
    <h1>病害图像诊断</h1>
    <nav>
      <a href="/">诊断</a>
      <a href="/kb">知识库管理</a>
      <a href="/dashboard">数据看板</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>上传信息</h2>
      <div class="form-row">
        <label for="file">图片文件</label>
        <input id="file" class="input" type="file" accept="image/*" />
      </div>
      <div class="form-row">
        <label for="symptoms">症状（逗号分隔）</label>
        <input id="symptoms" class="input" type="text" placeholder="例如：斑点, 发黄" />
      </div>
      <div class="form-row">
        <label for="crop_type">作物类型</label>
        <input id="crop_type" class="input" type="text" value="番茄" />
      </div>
      <div class="form-row">
        <label for="growth_stage">生长阶段（可选）</label>
        <input id="growth_stage" class="input" type="text" placeholder="例如：开花期" />
      </div>
      <div class="form-row">
        <label for="model_id">识别模型</label>
        <select id="model_id" class="input"></select>
      </div>
      <div class="actions">
        <button id="submitBtn" class="btn-primary">诊断</button>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section>
      <div class="card">
        <h2>诊断结果</h2>
        <div class="warning" id="confidenceWarning"></div>
        <div class="result-section">
          <img id="preview" class="preview" alt="上传图片预览" />
          <div><strong>最终病害：</strong><span id="finalDisease">-</span></div>
          <div><strong>置信度：</strong><span id="confidencePct">-</span></div>
          <div><strong>使用模型：</strong><span id="modelUsed" class="muted">-</span></div>
          <div>
            <strong>Top3</strong>
            <ul id="top3"></ul>
          </div>
          <div>
            <strong>治疗方案</strong>
            <div id="treatmentPlan" class="muted">暂无</div>
          </div>
          <div>
            <strong>预防建议</strong>
            <div id="treatmentPrevention" class="muted">暂无</div>
          </div>
          <div id="confirmPanel" class="muted" style="display:none;">
            <div style="margin-bottom:6px;">补充症状并复诊（逗号分隔）</div>
            <input id="confirmSymptoms" class="input" type="text" placeholder="例如：发黄, 斑点" />
            <button id="confirmBtn" class="btn-primary" style="margin-top:8px;" type="button">补充症状并复诊</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="trace-header">
          <h2>多智能体协作流程</h2>
          <div>
            <span class="muted">本次追踪ID：</span>
            <span id="traceId" class="muted">-</span>
            <span id="previousTraceWrap" class="muted" style="margin-left:8px; display:none;">
              上次追踪ID：<span id="previousTraceId">-</span>
            </span>
            <button id="traceRefreshBtn" class="btn-secondary" type="button">刷新</button>
          </div>
        </div>
        <div class="trace-error" id="traceError"></div>
        <div class="stepper" id="stepper"></div>
        <div class="live-log" id="liveLog"></div>
        <div class="trace-list" id="traceList"></div>
      </div>
    </section>
  </main>

  <script>
    const fileEl = document.getElementById('file');
    const symptomsEl = document.getElementById('symptoms');
    const cropTypeEl = document.getElementById('crop_type');
    const growthStageEl = document.getElementById('growth_stage');
    const modelIdEl = document.getElementById('model_id');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    const previewEl = document.getElementById('preview');
    const top3El = document.getElementById('top3');
    const finalDiseaseEl = document.getElementById('finalDisease');
    const confidencePctEl = document.getElementById('confidencePct');
    const modelUsedEl = document.getElementById('modelUsed');
    const treatmentPlanEl = document.getElementById('treatmentPlan');
    const treatmentPreventionEl = document.getElementById('treatmentPrevention');
    const confidenceWarningEl = document.getElementById('confidenceWarning');
    const traceIdEl = document.getElementById('traceId');
    const previousTraceWrap = document.getElementById('previousTraceWrap');
    const previousTraceIdEl = document.getElementById('previousTraceId');
    const traceRefreshBtn = document.getElementById('traceRefreshBtn');
    const traceErrorEl = document.getElementById('traceError');
    const traceListEl = document.getElementById('traceList');
    const stepperEl = document.getElementById('stepper');
    const liveLogEl = document.getElementById('liveLog');
    const confirmPanelEl = document.getElementById('confirmPanel');
    const confirmSymptomsEl = document.getElementById('confirmSymptoms');
    const confirmBtnEl = document.getElementById('confirmBtn');
    let latestTraceId = null;
    let previousTraceId = null;
    let latestImageId = null;
    let traceSource = null;
    const FLOW_STEPS = [
      'ParseInput',
      'DiagnosisAgent',
      'ConfidenceGate',
      'PersonalizationAgent',
      'KBRetrievalAgent',
      'PrescriptionAgent',
      'ValidatorAgent',
      'Persist',
      'Final',
    ];
    const STEP_LABELS = {
      ParseInput: 'ParseInput 解析输入',
      DiagnosisAgent: 'DiagnosisAgent 诊断',
      ConfidenceGate: 'ConfidenceGate 置信门控',
      PersonalizationAgent: 'PersonalizationAgent 个性化',
      KBRetrievalAgent: 'KBRetrievalAgent 知识检索',
      PrescriptionAgent: 'PrescriptionAgent 处置建议',
      ValidatorAgent: 'ValidatorAgent 校验',
      Persist: 'Persist 落盘',
      Final: 'Final 完成',
    };
    const stepState = Object.fromEntries(FLOW_STEPS.map((name) => [name, 'waiting']));

    function isTraceTerminalPause(event) {
      if (!event || typeof event !== 'object') return false;
      const node = event.node || '';
      const status = event.status || '';
      const payload = event.payload && typeof event.payload === 'object' ? event.payload : {};
      const payloadStatus = payload.status || '';
      return (node === 'AwaitUserConfirmation' && status === 'end')
        || status === 'waiting_for_supplement'
        || payloadStatus === 'waiting_for_supplement';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      statusEl.textContent = loading ? '诊断中...' : '';
    }

    function resetResult() {
      top3El.innerHTML = '';
      finalDiseaseEl.textContent = '-';
      confidencePctEl.textContent = '-';
      modelUsedEl.textContent = '-';
      treatmentPlanEl.textContent = '暂无';
      treatmentPreventionEl.textContent = '暂无';
      confidenceWarningEl.style.display = 'none';
      confidenceWarningEl.textContent = '';
      confirmPanelEl.style.display = 'none';
      confirmSymptomsEl.value = '';
      previewEl.style.display = 'none';
      previewEl.removeAttribute('src');
      traceIdEl.textContent = '-';
      previousTraceWrap.style.display = 'none';
      previousTraceIdEl.textContent = '-';
      traceErrorEl.textContent = '';
      traceListEl.innerHTML = '';
      latestTraceId = null;
      previousTraceId = null;
      latestImageId = null;
      traceRefreshBtn.disabled = true;
      closeTraceStream();
      resetStepper();
    }

    function shouldShowNeedConfirm(events) {
      return events.some(evt => {
        if (evt.agent !== 'diagnosis') return false;
        const outputs = evt.outputs || {};
        if (outputs.need_confirm) return true;
        const reasons = Array.isArray(outputs.fallback_reason) ? outputs.fallback_reason : [];
        return reasons.includes('low_confidence') || reasons.includes('low_margin');
      });
    }

    function resetStepper() {
      FLOW_STEPS.forEach((name) => { stepState[name] = 'waiting'; });
      renderStepper();
      liveLogEl.innerHTML = '';
    }

    function renderStepper() {
      stepperEl.innerHTML = '';
      FLOW_STEPS.forEach((name) => {
        const row = document.createElement('div');
        row.className = `step-item ${stepState[name] || 'waiting'}`;
        const label = document.createElement('span');
        label.textContent = STEP_LABELS[name] || name;
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = stepState[name] || 'waiting';
        row.appendChild(label);
        row.appendChild(badge);
        stepperEl.appendChild(row);
      });
    }

    function appendLiveLog(event) {
      const ts = event.ts || new Date().toISOString();
      const node = event.node || event.agent || 'Trace';
      const message = event.message || event.step || '';
      const line = document.createElement('div');
      line.className = 'live-log-line';
      line.textContent = `[${ts}] [${node}] ${message}`;
      liveLogEl.appendChild(line);
      liveLogEl.scrollTop = liveLogEl.scrollHeight;
    }

    function applyTraceEvent(event) {
      const node = event.node;
      const status = event.status;
      if (node && FLOW_STEPS.includes(node)) {
        if (status === 'start') stepState[node] = 'running';
        else if (status === 'end') stepState[node] = 'done';
        else if (status === 'error') stepState[node] = 'error';
        renderStepper();
      }
      appendLiveLog(event);
      if (isTraceTerminalPause(event) || (node === 'Final' && (status === 'end' || status === 'error'))) {
        closeTraceStream();
      }
    }

    function closeTraceStream() {
      if (traceSource) {
        traceSource.close();
        traceSource = null;
      }
    }

    function openTraceStream(traceId) {
      closeTraceStream();
      if (!traceId) return;
      const es = new EventSource(`/api/traces/${encodeURIComponent(traceId)}/stream`);
      traceSource = es;
      es.addEventListener('trace', (evt) => {
        try {
          const payload = JSON.parse(evt.data || '{}');
          applyTraceEvent(payload);
        } catch (err) {
          // noop
        }
      });
      es.onerror = () => {
        // 网络断开或服务端结束时关闭
        closeTraceStream();
      };
    }

    function renderTrace(events) {
      traceListEl.innerHTML = '';
      if (!events.length) {
        traceListEl.textContent = '暂无 trace 事件';
        return;
      }
      const agentMap = {
        supervisor: '监督智能体',
        reception: '接待智能体',
        diagnosis: '诊断智能体',
        kb_retrieval: '知识检索智能体',
        treatment: '治疗方案智能体',
      };
      const stepMap = {
        start: '开始',
        reception_complete: '接待完成',
        diagnosis_complete: '诊断完成',
        kb_retrieval_complete: '知识检索完成',
        treatment_complete: '方案生成完成',
        end: '结束',
      };
      const nextActionMap = {
        reception: '接待',
        diagnosis: '诊断',
        kb_retrieval: '知识检索',
        treatment: '方案生成',
        end: '结束',
      };
      events.forEach(evt => {
        const item = document.createElement('div');
        item.className = 'trace-item';
        const agent = agentMap[evt.agent] || evt.agent || '-';
        const step = stepMap[evt.step] || evt.step || '-';
        const ts = evt.ts || '-';
        const title = document.createElement('div');
        title.className = 'trace-title';
        title.textContent = `${ts} | ${agent} | ${step}`;
        item.appendChild(title);

        if (evt.agent === 'supervisor' && evt.decision) {
          const nextAction = nextActionMap[evt.decision.next_action] || evt.decision.next_action || '-';
          const reason = evt.decision.reason || '-';
          const meta = document.createElement('div');
          meta.className = 'trace-meta';
          meta.textContent = `下一步动作：${nextAction}｜决策原因：${reason}`;
          item.appendChild(meta);
        }
        traceListEl.appendChild(item);
      });
    }

    async function fetchTrace(traceId) {
      if (!traceId) return;
      traceErrorEl.textContent = '';
      try {
        const resp = await fetch(`/api/trace-events?trace_id=${encodeURIComponent(traceId)}`);
        const payload = await resp.json();
        if (!resp.ok) {
          throw new Error(payload.detail || `获取 trace 失败: ${resp.status}`);
        }
        const events = Array.isArray(payload.events) ? payload.events : [];
        renderTrace(events);
        if (events.some(isTraceTerminalPause)) {
          closeTraceStream();
        }
        const needsConfirm = shouldShowNeedConfirm(events);
        const diag = events.find(evt => evt.agent === 'diagnosis');
        const outputs = diag && diag.outputs ? diag.outputs : {};
        const conf = outputs.disease_confidence;
        const confidencePct = typeof conf === 'number' ? Math.round(conf * 100) : null;
        if (needsConfirm || (confidencePct !== null && confidencePct < 60)) {
          confidenceWarningEl.textContent = '识别置信度较低，建议补充症状信息以提高准确性。';
          confidenceWarningEl.style.display = 'block';
          confirmPanelEl.style.display = 'block';
        } else {
          confidenceWarningEl.style.display = 'none';
          confirmPanelEl.style.display = 'none';
        }
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        traceErrorEl.textContent = msg;
      }
    }

    async function runDiagnose() {
      const file = fileEl.files && fileEl.files[0];
      if (!file) {
        alert('请先选择图片文件');
        return;
      }

      resetResult();
      setLoading(true);

      const fd = new FormData();
      fd.append('file', file);
      fd.append('crop_type', (cropTypeEl.value || '番茄').trim() || '番茄');
      if (symptomsEl.value.trim()) fd.append('symptoms', symptomsEl.value.trim());
      if (growthStageEl.value.trim()) fd.append('growth_stage', growthStageEl.value.trim());
      if (modelIdEl.value) fd.append('model_id', modelIdEl.value);

      try {
        const resp = await fetch('/api/diagnose-image', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || `请求失败: ${resp.status}`);
        }

        if (data.image_url) {
          previewEl.src = data.image_url;
          previewEl.style.display = 'block';
        }

        const imageResult = data.image_result || {};
        const fallbackDisease = imageResult.disease || '-';
        const finalDisease = data.final_disease || fallbackDisease;
        finalDiseaseEl.textContent = finalDisease;
        const confidencePct = (imageResult.confidence_pct ?? null);
        confidencePctEl.textContent = confidencePct !== null ? `${Number(confidencePct).toFixed(2)}%` : '-';
        if (data.model_display_name) {
          const backend = data.model_backend ? ` (${data.model_backend})` : '';
          modelUsedEl.textContent = `${data.model_display_name}${backend}`;
        } else {
          modelUsedEl.textContent = data.model_id || '-';
        }
        if (confidencePct !== null && Number(confidencePct) < 60) {
          confidenceWarningEl.textContent = '识别置信度较低，建议补充症状信息以提高准确性。';
          confidenceWarningEl.style.display = 'block';
          confirmPanelEl.style.display = 'block';
        }

        const top3 = Array.isArray(imageResult.top3) ? imageResult.top3 : [];
        top3.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.disease || '-'} (${item.prob_pct ?? '-'}%)`;
          top3El.appendChild(li);
        });
        if (!top3.length) {
          const li = document.createElement('li');
          li.textContent = '暂无';
          top3El.appendChild(li);
        }

        if (data.treatment) {
          treatmentPlanEl.textContent = data.treatment.plan || '暂无';
          treatmentPreventionEl.textContent = data.treatment.prevention || '暂无';
        }

        if (data.trace_id) {
          latestTraceId = data.trace_id;
          traceIdEl.textContent = data.trace_id;
          traceRefreshBtn.disabled = false;
          if (data.previous_trace_id) {
            previousTraceId = data.previous_trace_id;
            previousTraceIdEl.textContent = data.previous_trace_id;
            previousTraceWrap.style.display = 'inline';
          }
          openTraceStream(data.trace_id);
          fetchTrace(data.trace_id);
        } else {
          traceErrorEl.textContent = '未获取到追踪ID，无法刷新协作流程。';
          traceRefreshBtn.disabled = true;
          closeTraceStream();
          resetStepper();
        }
        if (data.image_id) {
          latestImageId = data.image_id;
        }
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        alert(`诊断失败：${msg}`);
      } finally {
        setLoading(false);
      }
    }

    submitBtn.addEventListener('click', runDiagnose);
    traceRefreshBtn.addEventListener('click', () => fetchTrace(latestTraceId));
    confirmBtnEl.addEventListener('click', async () => {
      if (!latestImageId) {
        alert('缺少图片信息，无法复诊');
        return;
      }
      const symptomsInput = confirmSymptomsEl.value || '';
      const symptomList = symptomsInput
        .split(',')
        .map(item => item.trim())
        .filter(Boolean);
      try {
        const resp = await fetch('/api/diagnose-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trace_id: latestTraceId,
            previous_trace_id: previousTraceId,
            image_id: latestImageId,
            crop_type: (cropTypeEl.value || '番茄').trim() || '番茄',
            symptoms: symptomList,
            growth_stage: growthStageEl.value.trim() || null,
            model_id: modelIdEl.value || null,
          }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || `复诊失败: ${resp.status}`);
        }
        if (data.trace_id) {
          latestTraceId = data.trace_id;
          traceIdEl.textContent = data.trace_id;
          traceRefreshBtn.disabled = false;
        }
        if (data.previous_trace_id) {
          previousTraceId = data.previous_trace_id;
          previousTraceIdEl.textContent = data.previous_trace_id;
          previousTraceWrap.style.display = 'inline';
        }
        if (data.image_result) {
          const imageResult = data.image_result || {};
          const fallbackDisease = imageResult.disease || '-';
          const finalDisease = data.final_disease || fallbackDisease;
          finalDiseaseEl.textContent = finalDisease;
          const confidencePct = (imageResult.confidence_pct ?? null);
          confidencePctEl.textContent = confidencePct !== null ? `${Number(confidencePct).toFixed(2)}%` : '-';
        }
        if (data.model_display_name) {
          const backend = data.model_backend ? ` (${data.model_backend})` : '';
          modelUsedEl.textContent = `${data.model_display_name}${backend}`;
        }
        if (data.treatment) {
          treatmentPlanEl.textContent = data.treatment.plan || '暂无';
          treatmentPreventionEl.textContent = data.treatment.prevention || '暂无';
        }
        if (data.need_confirm) {
          confidenceWarningEl.textContent = data.confirm_message || '识别置信度较低，建议补充症状信息以提高准确性。';
          confidenceWarningEl.style.display = 'block';
          confirmPanelEl.style.display = 'block';
        } else {
          confidenceWarningEl.style.display = 'none';
          confirmPanelEl.style.display = 'none';
        }
        if (Array.isArray(data.events)) {
          renderTrace(data.events);
        } else if (data.trace_id) {
          openTraceStream(data.trace_id);
          fetchTrace(data.trace_id);
        }
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        alert(msg);
      }
    });
    traceRefreshBtn.disabled = true;

    async function loadModels() {
      try {
        const resp = await fetch('/api/models');
        const payload = await resp.json();
        if (!resp.ok) {
          throw new Error(payload.detail || '获取模型列表失败');
        }
        const models = Array.isArray(payload.models) ? payload.models : [];
        modelIdEl.innerHTML = '';
        if (!models.length) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = '暂无可用模型';
          modelIdEl.appendChild(option);
          modelIdEl.disabled = true;
          return;
        }
        models.forEach((model, index) => {
          const option = document.createElement('option');
          option.value = model.model_id;
          option.textContent = `${model.display_name} (${model.backend})`;
          if (index === 0) {
            option.selected = true;
          }
          modelIdEl.appendChild(option);
        });
        modelIdEl.disabled = false;
      } catch (err) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '模型列表加载失败';
        modelIdEl.innerHTML = '';
        modelIdEl.appendChild(option);
        modelIdEl.disabled = true;
      }
    }

    renderStepper();
    loadModels();
  </script>
</body>
</html>
