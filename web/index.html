<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图像诊断演示页</title>
  <style>
    body { font-family: sans-serif; max-width: 920px; margin: 20px auto; padding: 0 12px; }
    .row { margin: 10px 0; }
    label { display: inline-block; min-width: 120px; }
    input[type="text"] { width: 360px; }
    button { padding: 6px 12px; }
    #preview { max-width: 380px; max-height: 380px; display: none; }
    ul { margin: 6px 0 10px 20px; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .warning { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px 12px; border-radius: 6px; margin: 10px 0; color: #7a5d00; display: none; }
    .trace-panel { margin-top: 20px; border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; }
    .trace-list details { margin: 8px 0; }
    .trace-list summary { cursor: pointer; font-weight: 600; }
    .trace-meta { font-size: 12px; color: #666; margin-top: 4px; }
    .trace-error { color: #b00020; }
  </style>
</head>
<body>
  <h1>病害图像诊断（演示）</h1>

  <div class="row">
    <label for="file">图片文件</label>
    <input id="file" type="file" accept="image/*" />
  </div>
  <div class="row">
    <label for="symptoms">症状（逗号分隔）</label>
    <input id="symptoms" type="text" placeholder="例如：斑点,发黄" />
  </div>
  <div class="row">
    <label for="crop_type">crop_type</label>
    <input id="crop_type" type="text" value="番茄" />
  </div>
  <div class="row">
    <label for="growth_stage">growth_stage</label>
    <input id="growth_stage" type="text" placeholder="可选，例如：开花期" />
  </div>
  <div class="row">
    <button id="submitBtn">诊断</button>
    <span id="status"></span>
  </div>

  <hr />
  <h2>结果展示</h2>
  <div class="row">
    <img id="preview" alt="上传图片预览" />
  </div>
  <div class="row" id="top1"></div>
  <div class="row">
    <strong>Top3</strong>
    <ul id="top3"></ul>
  </div>
  <div class="row" id="finalDisease"></div>
  <div class="warning" id="confidenceWarning"></div>
  <div class="row">
    <strong>治疗方案</strong>
    <div id="treatmentPlan">暂无</div>
  </div>
  <div class="row">
    <strong>预防建议</strong>
    <div id="treatmentPrevention">暂无</div>
  </div>
  <div class="row" id="fallbackInfo"></div>
  <div class="row" id="ruleInfo"></div>

  <div class="trace-panel">
    <h3>协作流程</h3>
    <div class="row">
      <strong>trace_id:</strong>
      <span id="traceId">-</span>
      <button id="traceRefreshBtn" type="button">刷新</button>
    </div>
    <div class="row trace-error" id="traceError"></div>
    <div class="trace-list" id="traceList"></div>
  </div>

  <h3>原始 JSON</h3>
  <pre id="rawJson">{}</pre>

  <script>
    const fileEl = document.getElementById('file');
    const symptomsEl = document.getElementById('symptoms');
    const cropTypeEl = document.getElementById('crop_type');
    const growthStageEl = document.getElementById('growth_stage');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    const previewEl = document.getElementById('preview');
    const top1El = document.getElementById('top1');
    const top3El = document.getElementById('top3');
    const finalDiseaseEl = document.getElementById('finalDisease');
    const treatmentPlanEl = document.getElementById('treatmentPlan');
    const treatmentPreventionEl = document.getElementById('treatmentPrevention');
    const fallbackInfoEl = document.getElementById('fallbackInfo');
    const ruleInfoEl = document.getElementById('ruleInfo');
    const rawJsonEl = document.getElementById('rawJson');
    const confidenceWarningEl = document.getElementById('confidenceWarning');
    const traceIdEl = document.getElementById('traceId');
    const traceRefreshBtn = document.getElementById('traceRefreshBtn');
    const traceErrorEl = document.getElementById('traceError');
    const traceListEl = document.getElementById('traceList');
    let latestTraceId = null;

    function setLoading(loading) {
      submitBtn.disabled = loading;
      statusEl.textContent = loading ? '诊断中...' : '';
    }

    function resetResult() {
      top1El.textContent = '';
      top3El.innerHTML = '';
      finalDiseaseEl.textContent = '';
      treatmentPlanEl.textContent = '暂无';
      treatmentPreventionEl.textContent = '暂无';
      fallbackInfoEl.textContent = '';
      ruleInfoEl.textContent = '';
      confidenceWarningEl.style.display = 'none';
      confidenceWarningEl.textContent = '';
      previewEl.style.display = 'none';
      previewEl.removeAttribute('src');
      traceIdEl.textContent = '-';
      traceErrorEl.textContent = '';
      traceListEl.innerHTML = '';
      latestTraceId = null;
    }

    function shouldShowNeedConfirm(events) {
      return events.some(evt => {
        if (evt.agent !== 'diagnosis') return false;
        const outputs = evt.outputs || {};
        if (outputs.need_confirm) return true;
        const reasons = Array.isArray(outputs.fallback_reason) ? outputs.fallback_reason : [];
        return reasons.includes('low_confidence') || reasons.includes('low_margin');
      });
    }

    function renderTrace(events) {
      traceListEl.innerHTML = '';
      if (!events.length) {
        traceListEl.textContent = '暂无 trace 事件';
        return;
      }
      events.forEach(evt => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const agent = evt.agent || '-';
        const step = evt.step || '-';
        const ts = evt.ts || '-';
        let title = `${ts} | ${agent} | ${step}`;
        if (evt.decision && evt.decision.next_action) {
          title += ` → ${evt.decision.next_action}`;
        }
        summary.textContent = title;
        details.appendChild(summary);

        const meta = document.createElement('div');
        meta.className = 'trace-meta';
        meta.textContent = `trace_id: ${latestTraceId || '-'}`;
        details.appendChild(meta);

        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify({
          inputs: evt.inputs || {},
          outputs: evt.outputs || {},
          decision: evt.decision || null,
        }, null, 2);
        details.appendChild(pre);
        traceListEl.appendChild(details);
      });
    }

    async function fetchTrace(traceId) {
      if (!traceId) return;
      traceErrorEl.textContent = '';
      try {
        const resp = await fetch(`/api/traces/${traceId}`);
        const payload = await resp.json();
        if (!resp.ok) {
          throw new Error(payload.detail || `获取 trace 失败: ${resp.status}`);
        }
        const events = Array.isArray(payload.events) ? payload.events : [];
        renderTrace(events);
        if (shouldShowNeedConfirm(events)) {
          const confidencePct = (() => {
            const diag = events.find(evt => evt.agent === 'diagnosis');
            const outputs = diag && diag.outputs ? diag.outputs : {};
            const conf = outputs.disease_confidence;
            if (typeof conf === 'number') {
              return Math.round(conf * 100);
            }
            return null;
          })();
          const pctText = confidencePct !== null ? `${confidencePct}%` : '较低';
          confidenceWarningEl.textContent = `识别置信度较低（${pctText}），建议补充症状/环境信息以提高准确性。`;
          confidenceWarningEl.style.display = 'block';
        }
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        traceErrorEl.textContent = msg;
      }
    }

    async function runDiagnose() {
      const file = fileEl.files && fileEl.files[0];
      if (!file) {
        alert('请先选择图片文件');
        return;
      }

      resetResult();
      setLoading(true);

      const fd = new FormData();
      fd.append('file', file);
      fd.append('crop_type', (cropTypeEl.value || '番茄').trim() || '番茄');
      if (symptomsEl.value.trim()) fd.append('symptoms', symptomsEl.value.trim());
      if (growthStageEl.value.trim()) fd.append('growth_stage', growthStageEl.value.trim());

      try {
        const resp = await fetch('/api/diagnose-image', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || `请求失败: ${resp.status}`);
        }

        rawJsonEl.textContent = JSON.stringify(data, null, 2);

        if (data.image_url) {
          previewEl.src = data.image_url;
          previewEl.style.display = 'block';
        }

        const imageResult = data.image_result || {};
        top1El.textContent = `Top1: ${imageResult.disease || '-'} | confidence_pct: ${imageResult.confidence_pct ?? '-'}%`;

        const top3 = Array.isArray(imageResult.top3) ? imageResult.top3 : [];
        top3.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.disease || '-'} (${item.prob_pct ?? '-'}%)`;
          top3El.appendChild(li);
        });
        if (!top3.length) {
          const li = document.createElement('li');
          li.textContent = '暂无';
          top3El.appendChild(li);
        }

        finalDiseaseEl.textContent = `final_disease: ${data.final_disease || '-'}`;

        if (data.treatment) {
          treatmentPlanEl.textContent = data.treatment.plan || '暂无';
          treatmentPreventionEl.textContent = data.treatment.prevention || '暂无';
        }

        const reasons = Array.isArray(data.fallback_reason) ? data.fallback_reason.join(', ') : '无';
        fallbackInfoEl.textContent = `fallback_used: ${Boolean(data.fallback_used)} | fallback_reason: ${reasons}`;

        if (data.rule_result) {
          const rr = data.rule_result;
          ruleInfoEl.textContent = `rule_result: disease=${rr.rule_disease || '-'}, confidence_pct=${rr.rule_confidence_pct ?? '-'}%, description=${rr.rule_description || '-'}`;
        } else {
          ruleInfoEl.textContent = 'rule_result: 无';
        }

        if (data.trace_id) {
          latestTraceId = data.trace_id;
          traceIdEl.textContent = data.trace_id;
          fetchTrace(data.trace_id);
        }
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        rawJsonEl.textContent = JSON.stringify({ error: msg }, null, 2);
        alert(`诊断失败：${msg}`);
      } finally {
        setLoading(false);
      }
    }

    submitBtn.addEventListener('click', runDiagnose);
    traceRefreshBtn.addEventListener('click', () => fetchTrace(latestTraceId));
  </script>
</body>
</html>
