<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄病害图像诊断</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .row { margin-bottom: 12px; }
    input, button { padding: 8px; }
    #preview { max-width: 360px; margin-top: 12px; border: 1px solid #ddd; display: none; }
    pre { background: #f5f5f5; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>番茄病害图像诊断（Day2）</h1>

  <div class="row">
    <label>图片文件：</label>
    <input id="file" type="file" accept="image/*" />
  </div>

  <div class="row">
    <label>作物类型：</label>
    <input id="cropType" type="text" value="番茄" />
  </div>

  <div class="row">
    <label>症状（逗号分隔）：</label>
    <input id="symptoms" type="text" placeholder="如：斑点,发黄" style="width: 320px;" />
  </div>

  <div class="row">
    <label>生长阶段：</label>
    <input id="growthStage" type="text" placeholder="如：开花期" />
  </div>

  <div class="row">
    <button id="runBtn">诊断</button>
    <span id="status"></span>
  </div>

  <h3>诊断结果</h3>
  <div id="summary">暂无</div>

  <h3>上传图片回显</h3>
  <img id="preview" alt="上传图片" />

  <h3>原始 JSON</h3>
  <pre id="rawJson">{}</pre>

  <script>
    const fileInput = document.getElementById('file');
    const cropTypeInput = document.getElementById('cropType');
    const symptomsInput = document.getElementById('symptoms');
    const growthStageInput = document.getElementById('growthStage');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const previewEl = document.getElementById('preview');
    const rawJsonEl = document.getElementById('rawJson');

    function formatTop3(top3 = []) {
      return top3.map(item => `${item.disease}=${Number(item.prob).toFixed(2)}`).join(', ');
    }

    runBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('请先选择图片文件');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('crop_type', cropTypeInput.value || '番茄');
      if (symptomsInput.value.trim()) formData.append('symptoms', symptomsInput.value.trim());
      if (growthStageInput.value.trim()) formData.append('growth_stage', growthStageInput.value.trim());

      statusEl.textContent = '诊断中...';
      summaryEl.textContent = '处理中...';

      try {
        const resp = await fetch('/api/diagnose-image', { method: 'POST', body: formData });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.detail || '请求失败');
        }

        const imageRes = data.image_result || {};
        let summary = `Top1: ${imageRes.disease} (conf=${Number(imageRes.confidence || 0).toFixed(2)})`;
        summary += `\nTop3: ${formatTop3(imageRes.top3 || [])}`;

        if (data.fallback_used && data.rule_result) {
          summary += `\nFallback: true`;
          summary += `\nRule: ${data.rule_result.rule_disease} (conf=${Number(data.rule_result.rule_confidence || 0).toFixed(2)})`;
          summary += `\nDesc: ${data.rule_result.rule_description}`;
        } else {
          summary += `\nFallback: false`;
        }

        summaryEl.textContent = summary;

        if (data.image_url) {
          previewEl.src = data.image_url;
          previewEl.style.display = 'block';
        }

        rawJsonEl.textContent = JSON.stringify(data, null, 2);
        statusEl.textContent = '完成';
      } catch (err) {
        statusEl.textContent = '失败';
        summaryEl.textContent = String(err.message || err);
        rawJsonEl.textContent = '{}';
      }
    });
  </script>
</body>
</html>
